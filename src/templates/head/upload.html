<div id="upload" class="w-[50%] h-[80%] p-5 flex flex-col">
    <h1 class="h-[10%] font-bold text-left">Upload your Documents:</h1>
    <div
        id="dropzone"
        class="w-[100%] group flex justify-center items-center h-[100%] bg-gray-100"
    >
        <div
            class="w-[99%] h-[98%] group-hover:border-solid group-hover:border-blue-500 border-gray-400 border-dashed border-2 flex justify-center items-center"
        >
            <input id="file_upload" type="file" class="hidden" />
            <p id="error" class="text-center text-md">
                Drag-n-Drop or Click to upload your files!
            </p>
        </div>
    </div>
</div>

<div class="w-[50%] h-[80%] p-5 flex flex-col">
    <h1 class="h-[10%] font-bold text-left">Configuration:</h1>

    <div class="h-[80%] w-full">
        <div
            id="config"
            class="grid grid-cols-1 lg:grid-cols-2 grid-gap-4 h-full p-5"
        >
            <div class="w-full lg:col-span-2">
                <label for="llm" class="block mb-2">Large Language Model</label>
                <select
                    id="llm"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                >
                    <option selected="">Select an LLM</option>
                    <option value="llama-2">Llama 2</option>
                    <option value="gpt-3_5">GPT-3.5</option>
                    <option value="gpt-4">GPT-4</option>
                </select>
            </div>
            <div class="w-full">
                <label for="temp">Temperature</label>
                <br />
                <input
                    class="w-[75%] bg-transparent"
                    type="range"
                    name="temp"
                    id="temp"
                    min="0"
                    max="1"
                    value="0.6"
                    step="0.01"
                    list="tempMarkers"
                />
                <datalist id="tempMarkers">
                    <option value="0"></option>
                    <option value="0.25"></option>
                    <option value="0.5"></option>
                    <option value="0.75"></option>
                    <option value="1"></option>
                </datalist>
                <p class="hidden" id="tempVal"></p>
            </div>
            <div class="w-full">
                <label for="topK">Top-K</label>
                <br />
                <input
                    class="w-[75%] bg-transparent"
                    type="range"
                    name="topK"
                    id="topK"
                    min="10"
                    max="50"
                    value="10"
                    step="10"
                    list="kMarkers"
                />
                <datalist id="kMarkers">
                    <option value="10"></option>
                    <option value="20"></option>
                    <option value="30"></option>
                    <option value="40"></option>
                    <option value="50"></option>
                </datalist>
                <p class="hidden" id="kVal"></p>
            </div>
            <div class="w-full lg:col-span-2">
                <label for="vector" class="block mb-2">Vector Database</label>
                <select
                    id="vector"
                    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                >
                    <option selected="">Select an VectorDB</option>
                    <option value="chroma">Chroma</option>
                    <option value="faiss">FAISS</option>
                </select>
            </div>
        </div>
    </div>
    <button
        id="config-btn"
        class="bg-blue-500 text-gray-100 p-2 w-28 h-12 m-auto font-bold grid place-content-center hover:bg-blue-600"
    >
        Submit
    </button>
</div>
