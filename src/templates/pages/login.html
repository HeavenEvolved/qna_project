{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'login-register_styles.css' %}">

</head>

<body>
    <div class="container">
        <div class="background-image"></div>
        <div class="form">
            <h2>Login</h2>
            {% if messages %}
            <div style="width:100%;height:auto;border-radius: 10px;background-color: #0000ff50;padding:10px;color:white;" role ="alert">
                {% for message in messages%}
                {{ message }}
                {% endfor %}
            </div>
            {% endif %}
            <form method="post", enctype="multipart/form-data", action="{% url 'login' %}">
            {% csrf_token %}
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    <a href="forgot/" class="forgot-password"><b>Forgot Password?</b></a>
                    <a href="register/" class="onboarding"><b>Need an Account? SIGN UP<b></a>
                </div>
                <button type="submit" >Submit</button>
                <!-- <a href="main/">MAIN PAGE</a> -->
            </form>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js
"></script>
</body>

</html>
