{% extends "_base.html" %} {% block content %}

<div
    id="nav"
    class="h-1/6 col-span-2 w-screen flex justify-between bg-gray-200"
>
    <a class="h-44 w-44" href="home.html"><img
        class="bg-orange-500"
        src="../../static/elements/logo-no-bg.png"
        alt="WAISL Logo"
    /></a>
    <h1 class="h-full grid place-content-center font-bold text-3xl">
        WAISL GenAI Platform
    </h1>
    <div
        id="user"
        class="h-full w-44 flex justify-end items-center"
    >
        <img class="h-28 w-28 mr-8" src="../../static/elements/user.jpg" alt="" />
    </div>
</div>

<div
    id="main"
    class="flex justify-center items-center h-5/6 w-full bg-gray-400"
>
    <div class="w-5/6 h-4/5 bg-gray-200">
        <h1 class="w-full text-center font-bold text-2xl mt-10 mb-2">
            Welcome to the WAISL GenAI Platform
        </h1>
        <h5 class="w-full font-semibold text-center text-xl mt-5 mb-10">
            A next-generation AI Assistant for all your tasks, no matter the
            scale.
        </h5>
        <div id="btn-container" class="w-full flex justify-center align-middle">
            <button class="mr-5 h-10 bg-gray-100 text-gray-800 px-5 border-orange-500 border-2 box-border hover:bg-orange-500 hover:text-gray-200">Submit Business Interest</button>
            <button class="ml-5 h-10 bg-gray-100 text-gray-800 px-5 border-orange-500 border-2 box-border hover:bg-orange-500 hover:text-gray-200">Talk to WAISL-Gen</button>
        </div>
    </div>
</div>

{% endblock content %}
