{% load compress %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block head_title %}Home Page{% endblock head_title %}</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;900&display=swap"
            rel="stylesheet"
        />

        <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/1.8.1/flowbite.min.css" rel="stylesheet" />
        {% compress css %}
            {% include "head/css.html" %}
        {% endcompress %}
    </head>
    <body class="font-sans h-screen w-screen flex flex-wrap">
        {% include "head/nav.html" %}
        {% block content %}{% endblock content %}

        {% include "head/js.html" %}
    </body>
</html>
