<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WAISL Generative AI Platform</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="logo">
                <img src="./elements/logo-no-bg.png" alt="WAISL Logo" />
            </div>
            <div class="nav">
                <h1>WAISL Generative AI Platform</h1>
            </div>
            <div class="user">
                <p class="user_name">Heaven Evolved</p>
                <p class="user_handle">@heavenevolved</p>
                <img src="./elements/user.jpg" alt="" />
                <div class="menu">
                    <div class="menu-item"><a href="#">Reports</a></div>
                    <div class="menu-item"><a href="#">Config</a></div>
                    <div class="menu-item"><a href="#">Change Password</a></div>
                    <div class="menu-item"><a href="#">Log Out</a></div>
                </div>
            </div>
            <div class="config">
                <div class="configs">
                    <div class="llm-select">
                        <p>Select LLM</p>

                        <div class="llm-items">
                            <div class="llm-item">
                                <label for="llama-2">Llama 2</label>
                                <input
                                    type="radio"
                                    name="llm"
                                    id="llama-2"
                                    checked
                                />
                            </div>
                            <div class="llm-item">
                                <label for="gpt-3_5">GPT-3.5</label>
                                <input
                                    type="radio"
                                    name="llm"
                                    id="gpt-3_5"
                                />
                            </div>
                            <div class="llm-item">
                                <label for="gpt-4">GPT-4</label>
                                <input
                                    type="radio"
                                    name="llm"
                                    id="gpt-4"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="top-k-select">
                        <p>Top K</p>
                        <!-- <hr /> -->

                        <div class="top-k-items">
                            <div class="top-k-item">
                                <label for="top-k_10">10</label>
                                <input
                                    type="radio"
                                    name="top-k"
                                    id="top-k_10"
                                    checked
                                />
                            </div>
                            <div class="top-k-item">
                                <label for="top-k_20">20</label>
                                <input
                                    type="radio"
                                    name="top-k"
                                    id="top-k_20"
                                />
                            </div>
                            <div class="top-k-item">
                                <label for="top-k_30">30</label>
                                <input
                                    type="radio"
                                    name="top-k"
                                    id="top-k_30"
                                />
                            </div>
                        </div>
                    </div>

                    <div class="temp-select">
                        <p>Temperature</p>
                        <!-- <hr /> -->
                        <input
                            type="range"
                            name="temp"
                            id="temp"
                            min="0"
                            max="1"
                            value="0.75"
                            step="0.01"
                            list="temp-markers"
                        />
                        <p class="temp-text">
                            Temperature: <e id="tempVal">0.75</e>
                        </p>
                        <datalist id="temp-markers">
                            <option value="0"></option>
                            <option value="0.25"></option>
                            <option value="0.5"></option>
                            <option value="0.75"></option>
                            <option value="1"></option>
                        </datalist>
                    </div>

                    <div class="context-len">
                        <p>Context Length</p>
                        <!-- <hr /> -->
                        <input
                            type="range"
                            name="context"
                            id="context"
                            min="0"
                            max="513"
                            value="512"
                            step="512"
                            list="context-markers"
                        />
                        <p class="context-text">
                            Context Length: <e id="contextVal">512</e>
                        </p>
                        <datalist id="context-markers">
                            <option value="512"></option>
                            <option value="1024"></option>
                            <option value="2048"></option>
                            <option value="4096"></option>
                            <option value="8192"></option>
                        </datalist>
                    </div>
                </div>

                <div class="btn-container">
                    <button id="config-btn" type="submit">Save Config</button>
                </div>
            </div>
            <div class="content"></div>
        </div>

        <script
            src="https://code.jquery.com/jquery-3.7.1.js"
            integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
            crossorigin="anonymous"
        ></script>
        <script src="main.js"></script>
    </body>
</html>
